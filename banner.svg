<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.07" stroke="#a78bfa" stroke-width="0.5">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/>
  </g>

  <!-- Ambient glow circles -->
  <circle cx="200" cy="150" r="120" fill="#7c3aed" opacity="0.08"/>
  <circle cx="700" cy="150" r="100" fill="#2563eb" opacity="0.10"/>

  <!-- ===== LEFT: Inbox emails ===== -->
  <!-- Email 1 (spam - red tint) -->
  <g transform="translate(60, 80)" filter="url(#glow)">
    <rect x="0" y="0" width="110" height="52" rx="6" fill="#1e1b3a" stroke="#ef4444" stroke-width="1.2" opacity="0.9"/>
    <line x1="0" y1="18" x2="110" y2="18" stroke="#ef4444" stroke-width="0.8" opacity="0.5"/>
    <rect x="10" y="6" width="55" height="5" rx="2" fill="#ef4444" opacity="0.6"/>
    <rect x="10" y="25" width="90" height="4" rx="2" fill="#6b7280" opacity="0.5"/>
    <rect x="10" y="34" width="70" height="4" rx="2" fill="#6b7280" opacity="0.35"/>
    <rect x="10" y="43" width="50" height="4" rx="2" fill="#6b7280" opacity="0.25"/>
  </g>

  <!-- Email 2 (marketing - yellow tint) -->
  <g transform="translate(55, 145)" filter="url(#glow)">
    <rect x="0" y="0" width="110" height="52" rx="6" fill="#1e1b3a" stroke="#f59e0b" stroke-width="1.2" opacity="0.9"/>
    <line x1="0" y1="18" x2="110" y2="18" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
    <rect x="10" y="6" width="62" height="5" rx="2" fill="#f59e0b" opacity="0.6"/>
    <rect x="10" y="25" width="90" height="4" rx="2" fill="#6b7280" opacity="0.5"/>
    <rect x="10" y="34" width="75" height="4" rx="2" fill="#6b7280" opacity="0.35"/>
    <rect x="10" y="43" width="55" height="4" rx="2" fill="#6b7280" opacity="0.25"/>
  </g>

  <!-- Email 3 (keep - green tint) -->
  <g transform="translate(65, 210)" filter="url(#glow)">
    <rect x="0" y="0" width="110" height="52" rx="6" fill="#1e1b3a" stroke="#10b981" stroke-width="1.2" opacity="0.9"/>
    <line x1="0" y1="18" x2="110" y2="18" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
    <rect x="10" y="6" width="48" height="5" rx="2" fill="#10b981" opacity="0.6"/>
    <rect x="10" y="25" width="90" height="4" rx="2" fill="#6b7280" opacity="0.5"/>
    <rect x="10" y="34" width="65" height="4" rx="2" fill="#6b7280" opacity="0.35"/>
    <rect x="10" y="43" width="80" height="4" rx="2" fill="#6b7280" opacity="0.25"/>
  </g>

  <!-- Label: Inbox -->
  <text x="115" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a78bfa" opacity="0.7" text-anchor="middle">INBOX</text>

  <!-- ===== Arrows going right into AI ===== -->
  <g opacity="0.7">
    <line x1="178" y1="107" x2="335" y2="148" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="168" y1="171" x2="335" y2="155" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="178" y1="237" x2="335" y2="165" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- arrowheads -->
    <polygon points="335,148 325,144 326,152" fill="#a78bfa"/>
    <polygon points="335,155 325,151 326,159" fill="#a78bfa"/>
    <polygon points="335,165 325,160 327,168" fill="#a78bfa"/>
  </g>

  <!-- ===== CENTER: AI Brain / Claude ===== -->
  <g transform="translate(345, 110)" filter="url(#softglow)">
    <!-- Outer ring -->
    <circle cx="40" cy="40" r="42" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,3"/>
    <!-- Inner ring -->
    <circle cx="40" cy="40" r="32" fill="#1a1535" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <!-- Brain-like nodes -->
    <circle cx="40" cy="22" r="4" fill="#a78bfa"/>
    <circle cx="55" cy="32" r="3.5" fill="#60a5fa"/>
    <circle cx="58" cy="50" r="3.5" fill="#a78bfa"/>
    <circle cx="45" cy="60" r="3" fill="#60a5fa"/>
    <circle cx="28" cy="58" r="3.5" fill="#f472b6"/>
    <circle cx="22" cy="42" r="3" fill="#a78bfa"/>
    <circle cx="26" cy="26" r="3.5" fill="#60a5fa"/>
    <circle cx="40" cy="40" r="5" fill="url(#sparkGrad)"/>
    <!-- Connecting lines -->
    <g stroke="#a78bfa" stroke-width="0.8" opacity="0.5">
      <line x1="40" y1="22" x2="55" y2="32"/>
      <line x1="55" y1="32" x2="58" y2="50"/>
      <line x1="58" y1="50" x2="45" y2="60"/>
      <line x1="45" y1="60" x2="28" y2="58"/>
      <line x1="28" y1="58" x2="22" y2="42"/>
      <line x1="22" y1="42" x2="26" y2="26"/>
      <line x1="26" y1="26" x2="40" y2="22"/>
      <line x1="40" y1="40" x2="40" y2="22"/>
      <line x1="40" y1="40" x2="55" y2="32"/>
      <line x1="40" y1="40" x2="58" y2="50"/>
      <line x1="40" y1="40" x2="45" y2="60"/>
      <line x1="40" y1="40" x2="28" y2="58"/>
      <line x1="40" y1="40" x2="22" y2="42"/>
      <line x1="40" y1="40" x2="26" y2="26"/>
    </g>
  </g>

  <!-- AI Label -->
  <text x="385" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a78bfa" opacity="0.8" text-anchor="middle">CLAUDE AI</text>

  <!-- ===== Arrows going right out of AI ===== -->
  <g opacity="0.7">
    <!-- to trash -->
    <line x1="432" y1="148" x2="570" y2="110" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- to unsubscribe -->
    <line x1="432" y1="158" x2="570" y2="165" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- to keep -->
    <line x1="432" y1="168" x2="570" y2="220" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="570,110 560,106 561,114" fill="#ef4444"/>
    <polygon points="570,165 560,161 561,169" fill="#f59e0b"/>
    <polygon points="570,220 560,216 561,224" fill="#10b981"/>
  </g>

  <!-- ===== RIGHT: Outcome icons ===== -->

  <!-- Trash (spam) -->
  <g transform="translate(570, 78)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#1e1b3a" stroke="#ef4444" stroke-width="1.2"/>
    <!-- trash icon -->
    <rect x="27" y="16" width="26" height="28" rx="3" fill="none" stroke="#ef4444" stroke-width="2"/>
    <line x1="20" y1="20" x2="60" y2="20" stroke="#ef4444" stroke-width="2"/>
    <rect x="31" y="12" width="18" height="8" rx="2" fill="#ef4444" opacity="0.7"/>
    <line x1="33" y1="26" x2="33" y2="38" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
    <line x1="40" y1="26" x2="40" y2="38" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
    <line x1="47" y1="26" x2="47" y2="38" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
    <text x="40" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ef4444" opacity="0.8" text-anchor="middle">SPAM</text>
  </g>

  <!-- Unsubscribe (marketing) -->
  <g transform="translate(570, 148)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#1e1b3a" stroke="#f59e0b" stroke-width="1.2"/>
    <!-- unsubscribe icon: envelope with X -->
    <rect x="20" y="16" width="40" height="28" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <polyline points="20,16 40,28 60,16" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <line x1="46" y1="30" x2="58" y2="42" stroke="#ef4444" stroke-width="2.2"/>
    <line x1="58" y1="30" x2="46" y2="42" stroke="#ef4444" stroke-width="2.2"/>
    <text x="40" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#f59e0b" opacity="0.8" text-anchor="middle">UNSUB</text>
  </g>

  <!-- Keep (inbox) -->
  <g transform="translate(570, 195)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#1e1b3a" stroke="#10b981" stroke-width="1.2"/>
    <!-- checkmark in envelope -->
    <rect x="20" y="12" width="40" height="28" rx="3" fill="none" stroke="#10b981" stroke-width="1.8"/>
    <polyline points="20,12 40,24 60,12" fill="none" stroke="#10b981" stroke-width="1.8"/>
    <polyline points="30,24 37,32 52,20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#10b981" opacity="0.8" text-anchor="middle">KEEP</text>
  </g>

  <!-- ===== Main Title ===== -->
  <text x="450" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">email<tspan fill="url(#accentGrad)">-cleaner</tspan></text>

  <!-- Subtitle -->
  <text x="450" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="2">AI-POWERED EMAIL MANAGEMENT</text>

  <!-- Bottom accent line -->
  <rect x="150" y="285" width="600" height="2" rx="1" fill="url(#accentGrad)" opacity="0.4"/>
</svg>
